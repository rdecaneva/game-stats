{% extends "base.html" %}
{% block title %}Games · Game Stats{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Games</h1>
  <a class="muted" href="/">← Main menu</a>
</div>

<form method="get" action="/games" class="card search">
  <input type="search" name="q" value="{{ q }}" placeholder="Search for a game to log">
  <button class="btn" type="submit">Search</button>
</form>

{% if games %}
<div class="grid">
  {% for g in games %}
  <a class="card link-card" href="/games/{{ g.key }}">
    <span class="card-title">{{ g.name }}</span>
    <span class="muted">View stats →</span>
  </a>
  {% endfor %}
</div>
{% else %}
<p class="muted">No games found.</p>
{% endif %}
{% endblock %}
