{% macro input(f, value, listid=None) -%}
<label class="field">
  <span class="field-label">{{ f.label }}{% if f.required %} <span class="req">*</span>{% endif %}</span>
  {%- if f.kind == "select" %}
  <select name="{{ f.name }}" {% if f.required %}required{% endif %}>
    {% if not f.required %}<option value="">—</option>{% endif %}
    {% for opt in f.options %}
    <option value="{{ opt }}" {% if value == opt %}selected{% endif %}>{{ opt }}</option>
    {% endfor %}
  </select>
  {%- elif f.kind == "textarea" %}
  <textarea name="{{ f.name }}" rows="2">{{ value or '' }}</textarea>
  {%- else %}
  <input type="{{ 'number' if f.kind == 'number' else 'text' }}"
         {% if f.kind == 'number' %}inputmode="numeric" min="0"{% endif %}
         name="{{ f.name }}" value="{{ value or '' }}"
         {% if listid %}list="{{ listid }}"{% endif %}
         autocomplete="off" data-1p-ignore data-lpignore="true" data-form-type="other"
         {% if f.required %}required{% endif %}>
  {%- endif %}
</label>
{%- endmacro %}
