services:
  web:
    networks:
      default:
      decan-cloud:
        aliases: [stats]
    build: .
    ports:
      - "${PORT:-8080}:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped

networks:
  decan-cloud:
    external: true
    name: decan-cloud-services
